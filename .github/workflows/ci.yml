name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # S30 : analyse de secrets de l'arbre de travail (--no-git : les valeurs historiques déjà dans
  # Git ne bloquent pas ; toute réapparition dans un fichier suivi échoue). Configuration et
  # exceptions revues : .gitleaks.toml. Image épinglée par empreinte (gitleaks v8.21.2).
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --no-git --source /repo -c /repo/.gitleaks.toml --redact --exit-code 7
      # S30-e : uniquement les commits de la PR (base..tête) ; l'historique antérieur n'est pas rejoué
      - name: Gitleaks (commits de la PR)
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git /repo -c /repo/.gitleaks.toml --redact --exit-code 7
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Mots de passe du seed publiés
        run: |
          if git grep -nE '(Admin|Manager|User)123!Secure' -- . ':!docs/security' ':!.gitleaks.toml'; then
            echo "Valeur publiée du seed réintroduite (S30)." >&2
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: planner_pro_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test Frontend
        run: pnpm --filter frontend test:run
      - name: Test Backend
        run: pnpm --filter backend test
        env:
          DATABASE_URL: mysql://root:test_password@localhost:3306/planner_pro_test
          JWT_SECRET: test-jwt-secret-key-32-chars-minimum!
          ENCRYPTION_KEY: abcdefghijklmnopqrstuvwxyz123456
          REDIS_HOST: localhost
          REDIS_PORT: 6379
