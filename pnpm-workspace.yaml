packages:
  - 'frontend'
  - 'backend'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  'esbuild': true
  'prisma': true
  'unrs-resolver': true

# Audit S4 / A9 : source unique des overrides (pnpm 10 épinglé par packageManager) ;
# package.json#pnpm ne doit plus exister (ignoré, avec avertissement, par les pnpm récents).
overrides:
  mariadb: '>=3.5.4 <4'
  multer: '>=2.5.0 <3'
  'socket.io-parser': '>=4.2.7 <5'
  'engine.io': '>=6.6.10 <7'
  ws: '>=8.21.0 <9'
  'body-parser@<2': '>=1.20.9 <2'
  'body-parser@>=2': '>=2.2.1 <3'
  qs: '>=6.16.1 <7'
  lodash: '>=4.18.0 <5'
  mysql2: '>=3.23.1 <4'
  fast-uri: '>=3.1.9 <4'
  '@grpc/grpc-js': '>=1.13.6 <2'
  deepmerge-ts: '>=8.0.0 <9'
  valibot: '>=1.4.2 <2'
  file-type: '>=21.3.2 <22'
