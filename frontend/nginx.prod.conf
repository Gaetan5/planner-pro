server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx n'hérite pas des add_header d'un niveau supérieur dès qu'un bloc en définit un :
  # le fichier d'en-têtes (généré au démarrage par 40-security-headers.sh) est donc inclus dans
  # chaque location, sur la page d'entrée comme sur les assets (S22).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
